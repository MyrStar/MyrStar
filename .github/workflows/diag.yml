name: Diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Secret presence
        env:
          S: ${{ secrets.README_STATS_TOKEN }}
        run: |
          echo "secret_length=${#S}"
          echo "has_value=$([ -n "$S" ] && echo yes || echo no)"

      - name: Stats with secret token
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true
          path: diag/secret.svg
          token: ${{ secrets.README_STATS_TOKEN }}
          fail_on_error: "false"

      - name: Stats with github token
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true
          path: diag/gh.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "false"

      - name: Report both
        run: |
          for f in diag/secret.svg diag/gh.svg; do
            echo "--- $f (size $(stat -c%s "$f" 2>/dev/null || echo missing))"
            grep -oE ">([A-Za-z][^<]{3,60})<" "$f" 2>/dev/null | head -3
          done
