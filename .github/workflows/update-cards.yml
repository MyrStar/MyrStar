name: Update README cards

on:
  schedule:
    # 每天北京时间 03:00（= UTC 19:00）自动更新一次
    - cron: "0 19 * * *"
  push:
    paths:
      - ".github/workflows/update-cards.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          # 清爽配色：白底 + 青绿点缀
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&locale=cn&bg_color=ffffff&title_color=0d9488&text_color=24292f&icon_color=14b8a6
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&locale=zh_Hans&background=ffffff&border=e5e7eb&stroke=e5e7eb&ring=14b8a6&fire=14b8a6&currStreakNum=24292f&sideNums=24292f&currStreakLabel=0d9488&sideLabels=57606a&dates=57606a&excludeDaysLabel=57606a
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: hide_border=true&area=true&bg_color=ffffff&title_color=0d9488&color=24292f&line=14b8a6&point=14b8a6&area_color=14b8a6
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect generated cards
        run: |
          mkdir -p profile
          cp dist/activity-graph.svg profile/activity-graph.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git commit -m "Update README cards"; then
            git push
          else
            # 数据没变化时不会产生提交。仓库连续 60 天没有任何提交活动，
            # GitHub 会自动停掉定时任务；所以超过 45 天就补一个空提交保活。
            last=$(git log -1 --format=%ct)
            if [ $(( ($(date +%s) - last) / 86400 )) -ge 45 ]; then
              git commit --allow-empty -m "Keepalive: keep scheduled workflow enabled"
              git push
            fi
          fi
